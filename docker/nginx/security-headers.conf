# Security headers of the pages (the API sets its own with Hono secureHeaders).
# Included in every location: nginx drops inherited add_header as soon as a location declares one.
# img-src: cover suggestions are loaded straight from Cover Art Archive and Wikimedia (see 08-securite.md).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://coverartarchive.org https://*.archive.org https://upload.wikimedia.org https://thumb.wikimedia.org; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), midi=(self)" always;
