# Static PWA. /api is routed to the API container by Traefik (Dokploy) or Caddy (local), never here.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Files hashed by Vite: never change, cached forever.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Piano samples: not hashed, but never modified (a new sample set would get a new folder).
  location /samples/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Entry points of the PWA: always revalidated, so that a new version is picked up.
  location ~ ^/(sw\.js|workbox-[^/]+\.js|index\.html)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    default_type application/manifest+json;
    types { }
  }

  # Client-side routes (SPA).
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
