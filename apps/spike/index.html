<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0E13" />
    <title>Open Keys — spike falling notes</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage"></div>

    <pre id="hud" aria-live="off"></pre>

    <div id="controls">
      <label>Morceau
        <select id="song-select">
          <option value="/midi/chopin-etude-op10-1.mid">Chopin — Étude op. 10 n°1 (dense)</option>
          <option value="/midi/chopin-nocturne-op9-2.mid">Chopin — Nocturne op. 9 n°2</option>
        </select>
      </label>
      <label class="file">Fichier…<input id="file-input" type="file" accept=".mid,.midi,audio/midi" /></label>
      <button id="play-btn" type="button">▶ Lecture</button>
      <button id="back-btn" type="button">−5 s</button>
      <button id="fwd-btn" type="button">+5 s</button>
      <fieldset class="group" aria-label="Vitesse">
        <button type="button" data-rate="0.5">50 %</button>
        <button type="button" data-rate="0.75">75 %</button>
        <button type="button" data-rate="1" aria-pressed="true">100 %</button>
      </fieldset>
      <button id="loop-btn" type="button" aria-pressed="false">Boucle 8 s</button>
      <button id="zoom-btn" type="button" aria-pressed="false">Zoom auto</button>
      <label>Sync
        <select id="sync-select">
          <option value="output-timestamp">getOutputTimestamp</option>
          <option value="current-time">currentTime − latence</option>
          <option value="raw">currentTime brut</option>
        </select>
      </label>
      <label>Décalage <input id="offset-input" type="range" min="-200" max="200" step="5" value="0" /> <output id="offset-out">0 ms</output></label>
      <button id="fullscreen-btn" type="button">Plein écran</button>
      <button id="hide-btn" type="button">Masquer</button>
    </div>
    <button id="show-btn" type="button" hidden>☰</button>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
