packages:
  - apps/*
  - packages/*

# Shared versions: packages reference them with "catalog:".
catalog:
  "@types/node": 26.6.6
  typescript: 7.0.2
  vitest: 5.1.0
  zod: 4.6.7
allowBuilds:
  esbuild: true
  lefthook: false

# dependency-cruiser parses TypeScript through the TS JS API, not published yet for TS 7.
# Give it its own TypeScript 6 until it supports TS 7.
packageExtensions:
  dependency-cruiser:
    dependencies:
      typescript: 6.0.3
