name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, architecture, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Architecture rules (dependency-cruiser)
        run: pnpm deps:check

      - name: Schema consistency (migrations and DBML up to date)
        run: pnpm db:check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (Chromium, Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install the browsers
        run: pnpm --filter @open-keys/e2e exec playwright install --with-deps chromium firefox

      - name: Playwright
        run: pnpm e2e

      - name: Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
