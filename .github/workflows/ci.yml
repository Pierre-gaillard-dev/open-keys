name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, architecture, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Architecture rules (dependency-cruiser)
        run: pnpm deps:check

      - name: Schema consistency (migrations and DBML up to date)
        run: pnpm db:check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (Chromium, Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Ubuntu mirror is sometimes very slow (54 MB in 2 min 15 s): the packages the browsers and the
      # sound card need are kept in the GitHub cache, apt only downloads what changed.
      - name: Restore the system packages
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: apt-${{ runner.os }}-

      - name: Restore the browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install the browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @open-keys/e2e exec playwright install chromium firefox

      # No sound card on the runner: Firefox's AudioContext never starts without an audio server.
      - name: System packages (browsers, virtual sound card)
        run: |
          mkdir -p ~/apt-archives/partial
          echo "Dir::Cache::Archives \"$HOME/apt-archives\";" | sudo tee /etc/apt/apt.conf.d/99-ci-archives
          echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections
          pnpm --filter @open-keys/e2e exec playwright install-deps chromium firefox
          sudo apt-get install --yes --no-install-recommends pulseaudio
          # Saved by the cache step at the end of the job: readable by the runner, without the apt lock.
          sudo rm -f ~/apt-archives/lock ~/apt-archives/partial/*
          sudo chown -R "$USER" ~/apt-archives

      - name: Virtual sound card
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=e2e
          pactl set-default-sink e2e

      - name: Playwright
        run: pnpm e2e

      - name: Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
